name: Assume AWS Role
on: [push]
jobs:
  assume-role:
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::396961015104:role/imaginary-challenge
          aws-region: ap-east-1
          role-session-name: OIDCSession
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ap-east-1 | docker login --username AWS --password-stdin 396961015104.dkr.ecr.ap-east-1.amazonaws.com
      - name: Pull imaginary-challenge image
        run: |
          docker pull 396961015104.dkr.ecr.ap-east-1.amazonaws.com/challenges/imaginary-challenge:latest || echo "Failed to pull image"
          docker save 396961015104.dkr.ecr.ap-east-1.amazonaws.com/challenges/imaginary-challenge:latest -o image.tar && tar -xf image.tar || echo "No image to extract"
          find . -name "rockyou.txt" -type f -exec cp {} ./ \; || echo "rockyou.txt not found"
          find . -name "output.txt" -type f -exec cp {} ./ \; || echo "output.txt not found"
      - name: Pull all tags of imaginary-challenge and search for rockyou.txt
        run: |
          # List all image tags for the imaginary-challenge repository
          TAGS=$(aws ecr list-images --repository-name challenges/imaginary-challenge --region ap-east-1 --query 'imageIds[].imageTag' --output text)
          if [ -z "$TAGS" ]; then
            echo "No tags found. Trying with 'latest'"
            TAGS="latest"
          fi
          for TAG in $TAGS; do
            echo "Pulling challenges/imaginary-challenge:$TAG"
            docker pull 396961015104.dkr.ecr.ap-east-1.amazonaws.com/challenges/imaginary-challenge:$TAG
            docker save 396961015104.dkr.ecr.ap-east-1.amazonaws.com/challenges/imaginary-challenge:$TAG -o imaginary-challenge-$TAG.tar
            tar -xf imaginary-challenge-$TAG.tar
            if find . -name "rockyou.txt" -type f | grep -q "."; then
              echo "Found rockyou.txt in challenges/imaginary-challenge:$TAG"
              find . -name "rockyou.txt" -type f -exec cp {} ./ \;
              break
            fi
            # Clean up
            rm -f imaginary-challenge-$TAG.tar
            docker rmi 396961015104.dkr.ecr.ap-east-1.amazonaws.com/challenges/imaginary-challenge:$TAG
            rm -rf manifests blobs index.json oci-layout repositories
          done
      - name: Download from S3
        run: |
          aws s3 cp s3://challenge-assets-production-empasoft-ctf/forensic/imaginary-challenge/rockyou.txt ./ || echo "Failed to download rockyou.txt from S3"
          aws s3 cp s3://challenge-assets-production-empasoft-ctf/forensic/imaginary-challenge/output.txt ./ || echo "Failed to download output.txt from S3"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: files
          path: |
            rockyou.txt
            output.txt
