name: Assume AWS Role
on: [push]
jobs:
  assume-role:
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::396961015104:role/imaginary-challenge
          aws-region: ap-east-1
          role-session-name: OIDCSession
      - name: List S3 objects
        run: |
          aws s3 ls s3://challenge-assets-production-empasoft-ctf/forensic/imaginary-challenge/ --recursive
      - name: Download files from S3
        run: |
          aws s3 cp s3://challenge-assets-production-empasoft-ctf/forensic/imaginary-challenge/ ./ --recursive
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: s3-files
          path: |
            *.txt
